<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="Closing card blue software engineering systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
